services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vesteia
      POSTGRES_USER: vesteia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vesteia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesteia -d vesteia"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vesteia_data:
